# The model catalog: every model ember knows by name.
#
# Each value was read from the provider's official documentation on the date in
# `as_of`, at the URLs in `sources` (identity, limits, accepted settings and
# reasoning efforts) and `rates.source_url` (prices). Nothing here is estimated
# or remembered. To add or change a model, fetch the provider's page, copy the
# values, and update the URLs and dates in the same change.
#
# Fields:
#   id                 provider/name, the canonical name.
#   wire_id            the model id sent to the provider's API.
#   api                openai_chat | openai_responses | anthropic_messages | gemini.
#   aliases            bare names that resolve to this model.
#   accepts            settings the model accepts, from: temperature, top_p,
#                      max_output_tokens, stop, seed, reasoning_effort.
#   reasoning_efforts  allowed reasoning_effort values, in the provider's spelling.
#   context_window     prompt plus output tokens, where the page states that.
#   max_input_tokens   prompt tokens, where the page states an input limit.
#   rates              US dollars per million tokens, as exact decimal strings.
#                      A missing cache_read or cache_write means the provider
#                      publishes no such price for the model, which reports no
#                      such tokens (no prompt caching, or no cache writes). A
#                      missing rates table means the price is not a fixed
#                      per-token rate.
#   rates.long_context rates that apply when a prompt (uncached input plus cache
#                      reads and writes) has more than above_prompt_tokens tokens.
#
# Provider notes, read on 2026-11-07:
# - Anthropic: `accepts` assumes API version 2026-10-21, under which a request
#   that sends temperature, top_p or top_k returns a 400 error on every model.
#   cache_write is the 5-minute cache write price; 1-hour writes cost more.
# - OpenAI: models use the Responses API, which OpenAI recommends for all new
#   projects. Responses has no stop or seed parameter. cache_write is the 30m
#   write price where the page prints one; for GPT-5.5 and earlier, OpenAI's
#   prompt caching guide states "No additional cache-write charge", so
#   cache_write equals the input price. The Pro models print no cached-input
#   price, so they have no cache_read.
# - Gemini: Google now calls generateContent "a legacy API" and recommends the
#   Interactions API; ember ships the generateContent codec. No page states a
#   cache write price, and Gemini reports no cache-write tokens, so cache_write
#   is absent. Model pages state an input token limit, except Gemini 4 Argon's,
#   which states a unified input and output context window. gemini-4-argon,
#   gemini-3.8-flash and gemini-3.6-flash have introductory prices that change
#   on a fixed date, so they have no rates.

