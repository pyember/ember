name: ci

on:
  push:
    branches: [main, v0.2]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.7"

jobs:
  check:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Starting guesses; tighten once there are run durations to read.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Every Python the package declares support for (requires-python).
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --group dev --all-extras
      - run: uv run pytest -q

  # The suite on the other systems people install on. GitHub-hosted: the
  # CI_RUNNER fleet is Linux only.
  test-os:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --group dev --all-extras
      - run: uv run pytest -q

  # The suite against the oldest versions pyproject.toml says ember works with:
  # direct dependencies at their minimum, everything else current, on the
  # oldest supported Python. A failure means a declared minimum is wrong.
  test-floors:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      UV_RESOLUTION: lowest-direct
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
      # Not --locked: the committed lockfile holds current versions.
      - run: uv sync --group dev --all-extras
      - run: uv pip list
      - run: uv run pytest -q

  # TEMPORARY, removed before this branch merges. Alternates a short read
  # through the datasets stream and through the new file path, each a new
  # process, with the library versions that reproduced the exit hang.
  hub-count:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - run: uv sync --locked --extra data
      - run: uv pip install datasets==3.6.0 pyarrow==20.0.0 huggingface-hub==0.35.3
      - run: uv pip list | grep -E "^(datasets|pyarrow|huggingface-hub|hf-xet) "
      - name: Twenty rounds, one attempt of each read per round
        shell: bash
        run: |
          set +e -uo pipefail
          cat > "$RUNNER_TEMP/file.py" <<'PY'
          from ember import data

          for name in ("gsm8k", "mmlu"):
              print(name, len(list(data.stream(name, limit=3))), flush=True)
          print("script done", flush=True)
          PY
          cat > "$RUNNER_TEMP/stream.py" <<'PY'
          import dataclasses

          from ember import data

          for name in ("gsm8k", "mmlu"):
              spec = dataclasses.replace(data.DATASETS[name], parquet_file=None)
              print(name, len(list(data.stream(spec, limit=3))), flush=True)
          print("script done", flush=True)
          PY
          # One line per attempt, counted at the end (macOS's bash 3.2 has no maps).
          results="$RUNNER_TEMP/results.txt"
          : > "$results"
          for i in $(seq 1 20); do
            for label in stream file; do
              out="$RUNNER_TEMP/out-$label-$i.txt"
              # The alarm survives exec and ends a process that cannot exit (status 142).
              HF_HOME="$RUNNER_TEMP/hf-$label-$i" perl -e 'alarm 45; exec @ARGV' \
                .venv/bin/python -u "$RUNNER_TEMP/$label.py" > "$out" 2>&1
              status=$?
              if [ "$status" -eq 0 ]; then
                echo "$label exited" >> "$results"
              elif [ "$status" -eq 142 ]; then
                echo "$label stuck" >> "$results"
                echo "round $i, $label: still running at 45 s; last output: $(grep -v Warning "$out" | tail -1)"
              else
                echo "$label failed" >> "$results"
                echo "round $i, $label: failed with status $status:"; tail -6 "$out"
              fi
            done
          done
          for label in stream file; do
            echo "RESULT $label: $(grep -c "^$label exited" "$results") exited," \
              "$(grep -c "^$label stuck" "$results") still running at 45 s," \
              "$(grep -c "^$label failed" "$results") failed otherwise"
          done

  # TEMPORARY, removed before this branch merges. Every example of these splits,
  # read from the pinned file and streamed by the datasets library, must match.
  hub-same-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - run: uv sync --locked --extra data
      - name: Compare the file read with the stream
        shell: bash
        run: |
          set -euo pipefail
          HF_HOME="$RUNNER_TEMP/hf" uv run python - <<'PY'
          import dataclasses
          import sys

          from ember import data

          splits = {"mmlu": ("test", "validation", "dev"), "gsm8k": ("test", "train")}
          ok = True
          for name, names in splits.items():
              spec = data.DATASETS[name]
              streamed_spec = dataclasses.replace(spec, parquet_file=None)
              for split in names:
                  from_file = list(data.stream(spec, split=split))
                  streamed = list(data.stream(streamed_spec, split=split))
                  same = from_file == streamed and [e.metadata for e in from_file] == [
                      e.metadata for e in streamed
                  ]
                  ok = ok and same
                  print(f"{name} {split}: {len(from_file)} from the file, "
                        f"{len(streamed)} streamed, identical: {same}", flush=True)
          sys.exit(0 if ok else 1)
          PY

  wheel:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - name: Build the wheel and import it in a clean environment
        run: |
          set -euo pipefail
          uv build --wheel --out-dir dist
          uv venv --python 3.13 /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          cd /tmp
          HOME=/tmp/empty-home /tmp/clean/bin/python -c "import ember, sys; print(ember.__version__); sys.exit(0)"
          # The model catalog is package data: fail if the wheel lacks it.
          HOME=/tmp/empty-home /tmp/clean/bin/python -c "from ember.llm import catalog; spec = catalog.default().resolve('gpt-5.5'); assert spec.known and spec.rates is not None; print(spec.ref, spec.wire_id)"
